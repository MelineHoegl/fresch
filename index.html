<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRESCH-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Schulheft-Seite – Stationen-Übersicht als Karten, darunter eine Aufgabe nach der anderen */
:root{
  --paper:#f7f9fc; --sheet:#ffffff; --line:#d6e2f2; --ink:#1d2a3d; --muted:#5a6a80;
  --margin:#e06666;
  --s1:#e0892b; --s2:#2f7fd1; --s3:#2e9b6a; --s4:#8a5cc7; --s5:#d0475b;
  --ok:#22865a; --okbg:#e3f5ec; --bad:#c43c3c; --badbg:#fbe8e8;
  --font-display:"Trebuchet MS",system-ui,sans-serif;
  --font-body:"Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151b25; --sheet:#1c2431; --line:#2c3a4f; --ink:#e8eef7; --muted:#9fb0c6; --margin:#b85454;
  --s1:#f0a24c; --s2:#5ea4ee; --s3:#4fc08c; --s4:#ad86e6; --s5:#ef6f80;
  --ok:#5fd39b; --okbg:#173328; --bad:#ff8a8a; --badbg:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151b25; --sheet:#1c2431; --line:#2c3a4f; --ink:#e8eef7; --muted:#9fb0c6; --margin:#b85454;
  --s1:#f0a24c; --s2:#5ea4ee; --s3:#4fc08c; --s4:#ad86e6; --s5:#ef6f80;
  --ok:#5fd39b; --okbg:#173328; --bad:#ff8a8a; --badbg:#3a1d22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.3rem;font-weight:800}
h1 span{color:var(--s2)}
.lead{color:var(--muted);margin:4px 0 0;max-width:60ch}
.word-fresch{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.word-fresch b{font-family:var(--font-display);font-size:1.4rem;width:2.1rem;height:2.1rem;display:grid;place-items:center;border-radius:8px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;
  display:flex;gap:14px;align-items:flex-start;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--c);transform:translateY(-2px);outline:none}
.card .sym{flex:none;width:56px;height:56px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,transparent);display:grid;place-items:center}
.card h3{font-size:1.3rem;color:var(--c)}
.card p{margin:2px 0 6px;color:var(--muted);font-size:.95rem}
.stars{display:flex;gap:6px;font-size:.85rem;flex-wrap:wrap}
.stars span{padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.stars span.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.helper{background:var(--sheet);border:2px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:.95rem}
.helper strong{color:var(--ink)}
/* Station */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{font:inherit;background:none;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.back:focus-visible,.lvl:focus-visible,.opt:focus-visible,.tok:focus-visible,.btn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.merk{background:color-mix(in srgb,var(--c) 10%,var(--sheet));border-left:6px solid var(--c);border-radius:10px;padding:12px 16px}
.merk h3{font-size:1.1rem;color:var(--c);margin-bottom:4px}
.merk p{margin:0}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvl{font:inherit;font-weight:700;background:var(--sheet);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer}
.lvl[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 20px 20px 34px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 36px);}
.sheet::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}
.task{font-weight:700;margin:0 0 4px}
.progress{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.progress i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.progress i.ok{background:var(--ok)}.progress i.no{background:var(--bad)}.progress i.now{outline:2px solid var(--c);outline-offset:1px}
.word{font-family:var(--font-display);font-size:clamp(2rem,7vw,3rem);font-weight:600;letter-spacing:.04em;margin:10px 0 18px;word-break:break-word}
.gap{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--c);color:var(--c);text-align:center}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{font:inherit;font-size:1.25rem;font-weight:700;min-width:84px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.sentence{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px;font-size:1.35rem}
.tok{font:inherit;background:none;border:2px solid transparent;border-bottom-color:var(--line);color:var(--ink);border-radius:8px;padding:2px 8px;cursor:pointer}
.tok.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tok.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.tok.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.tok.miss{border-color:var(--bad);border-style:dashed}
.tok.fixed{cursor:default;border-bottom-color:transparent}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:1.05rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.fb small{display:block;color:var(--ink);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{font:inherit;font-weight:700;padding:10px 20px;border-radius:12px;border:none;background:var(--c);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.hint{margin-top:12px;color:var(--muted);font-size:.95rem}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--font-display);font-size:3rem;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const SYM = {
  schwingen:'<svg width="40" height="28" viewBox="0 0 40 28"><path d="M2 22 Q8 4 14 22 Q20 4 26 22 Q32 4 38 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
  verlaengern:'<svg width="40" height="28" viewBox="0 0 40 28"><path d="M4 14 H32 M24 6 L34 14 L24 22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ableiten:'<svg width="44" height="30" viewBox="0 0 44 30"><text x="2" y="23" font-size="20" font-family="Baloo 2,sans-serif" font-weight="800" fill="currentColor">a</text><path d="M15 16 H27 M23 12 L28 16 L23 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><text x="29" y="23" font-size="20" font-family="Baloo 2,sans-serif" font-weight="800" fill="currentColor">ä</text></svg>',
  merk:'<svg width="40" height="30" viewBox="0 0 40 30"><path d="M3 15 Q20 0 37 15 Q20 30 3 15 Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="15" r="5" fill="currentColor"/></svg>',
  gross:'<svg width="44" height="30" viewBox="0 0 44 30"><text x="1" y="26" font-size="28" font-family="Baloo 2,sans-serif" font-weight="800" fill="currentColor">A</text><text x="24" y="26" font-size="18" font-family="Baloo 2,sans-serif" font-weight="800" fill="currentColor">a</text></svg>'
};

const STATIONS = [
{ id:"schwingen", name:"Schwingen", c:"--s1", short:"Silben schwingen und mitsprechen",
  merk:"Sprich das Wort deutlich in Silben und schwinge mit. Ist der Selbstlaut kurz, hörst du den Mitlaut am Ende der ersten Silbe und am Anfang der zweiten Silbe: <b>Son-ne</b>, <b>Tel-ler</b>. Dann schreibst du ihn doppelt.",
  q:"Schwinge das Wort. Hörst du den Mitlaut in beiden Silben?",
  levels:[
   {task:"Wähle: einfacher oder doppelter Mitlaut?", type:"choice", items:[
    {w:"So_e",o:["n","nn"],a:"nn",why:"Son-ne: kurzes o, das n hörst du zweimal."},
    {w:"Te_er",o:["l","ll"],a:"ll",why:"Tel-ler: kurzes e, darum ll."},
    {w:"Ha_er",o:["m","mm"],a:"mm",why:"Ham-mer: kurzes a, darum mm."},
    {w:"Fe_er",o:["d","dd"],a:"d",why:"Fe-der: langes e, darum nur ein d."},
    {w:"Pu_e",o:["p","pp"],a:"pp",why:"Pup-pe: kurzes u, darum pp."},
    {w:"Bri_e",o:["l","ll"],a:"ll",why:"Bril-le: kurzes i, darum ll."},
    {w:"Ho_e",o:["s","ss"],a:"s",why:"Ho-se: langes o, darum nur ein s."},
    {w:"Ta_e",o:["n","nn"],a:"nn",why:"Tan-ne: kurzes a, darum nn."}]},
   {task:"Wähle die richtige Silbentrennung.", type:"choice", items:[
    {w:"Kartoffel",o:["Kar-tof-fel","Kart-off-el","Ka-rtof-fel"],a:"Kar-tof-fel",why:"Kar-tof-fel: drei Silben, das ff wird getrennt."},
    {w:"Gitarre",o:["Gi-tar-re","Git-ar-re","Gi-ta-rre"],a:"Gi-tar-re",why:"Gi-tar-re: das rr wird getrennt."},
    {w:"Schmetterling",o:["Schmet-ter-ling","Schme-tter-ling","Schmett-er-ling"],a:"Schmet-ter-ling",why:"Schmet-ter-ling: das tt wird getrennt."},
    {w:"Banane",o:["Ba-na-ne","Ban-an-e","Bana-ne"],a:"Ba-na-ne",why:"Ba-na-ne: drei Silben, jede beginnt mit einem Mitlaut."},
    {w:"Löwenzahn",o:["Lö-wen-zahn","Löw-en-zahn","Lö-we-nzahn"],a:"Lö-wen-zahn",why:"Lö-wen-zahn: drei Silben."},
    {w:"Wolle",o:["Wol-le","Wo-lle","Woll-e"],a:"Wol-le",why:"Wol-le: das ll wird getrennt."}]},
   {task:"Fehlerdetektiv: Tippe das falsch geschriebene Wort an.", type:"detect", items:[
    {s:"Der Hund schwimt im See.",wrong:"schwimt",right:"schwimmt",why:"schwim-men → mm"},
    {s:"Wir spielen heute Nachmitag Fußball.",wrong:"Nachmitag",right:"Nachmittag",why:"Mit-tag → tt"},
    {s:"Meine Schwester hat eine neue Brile.",wrong:"Brile",right:"Brille",why:"Bril-le → ll"},
    {s:"Im Sommer ist das Waser im Freibad warm.",wrong:"Waser",right:"Wasser",why:"Was-ser → ss"},
    {s:"Opa repariert den Roler.",wrong:"Roler",right:"Roller",why:"Rol-ler → ll"}]}
  ]},
{ id:"verlaengern", name:"Verlängern", c:"--s2", short:"d oder t? g oder k? b oder p?",
  merk:"Am Wortende klingen <b>d/t</b>, <b>g/k</b> und <b>b/p</b> oft gleich. Verlängere das Wort, dann hörst du es: <b>Hund → Hun-de</b>. Nomen in die Mehrzahl setzen, Adjektive steigern oder ein Nomen dazustellen, Verben in die Grundform setzen.",
  q:"Verlängere das Wort. Was hörst du jetzt?",
  levels:[
   {task:"Verlängere das Nomen und wähle: d oder t?", type:"choice", items:[
    {w:"der Hun_",o:["d","t"],a:"d",why:"die Hun-de → d"},
    {w:"das Zel_",o:["d","t"],a:"t",why:"die Zel-te → t"},
    {w:"der Wal_",o:["d","t"],a:"d",why:"die Wäl-der → d"},
    {w:"das Bro_",o:["d","t"],a:"t",why:"die Bro-te → t"},
    {w:"das Kin_",o:["d","t"],a:"d",why:"die Kin-der → d"},

    {w:"das Hem_",o:["d","t"],a:"d",why:"die Hem-den → d"}]},
   {task:"Verlängere und wähle den richtigen Buchstaben.", type:"choice", items:[

    {w:"der Kor_",o:["b","p"],a:"b",why:"die Kör-be → b"},
    {w:"der Schran_",o:["g","k"],a:"k",why:"die Schrän-ke → k"},
    {w:"der Die_",o:["b","p"],a:"b",why:"die Die-be → b"},

    {w:"das Kal_",o:["b","p"],a:"b",why:"die Käl-ber → b"},

   {task:"Verben und Adjektive: Verlängere und wähle.", type:"choice", items:[
    {w:"Er gi_t mir das Heft.",o:["b","p"],a:"b",why:"ge-ben → er gibt"},
    {w:"Der Vogel flie_t weg.",o:["g","k"],a:"g",why:"flie-gen → er fliegt"},
    {w:"Das Wasser ist kal_.",o:["d","t"],a:"t",why:"kal-te Füße, käl-ter → kalt"},
    {w:"Das Glas ist hal_ voll.",o:["b","p"],a:"b",why:"die hal-be Pizza → halb"},
    {w:"Der Weg ist sehr en_.",o:["g","k"],a:"g",why:"die en-ge Straße → eng"},
    {w:"Mein Pulli ist bun_.",o:["d","t"],a:"t",why:"bun-te Farben → bunt"},
    {w:"Sie sa_t nichts.",o:["g","k"],a:"g",why:"sa-gen → sie sagt"},
    {w:"Der Hund bellt lau_.",o:["d","t"],a:"t",why:"lau-te Musik → laut"}]}
  ]},
{ id:"ableiten", name:"Ableiten", c:"--s3", short:"e oder ä? eu oder äu?",
  merk:"<b>ä</b> und <b>e</b>, <b>äu</b> und <b>eu</b> klingen gleich. Suche ein verwandtes Wort: Gibt es eines mit <b>a</b> oder <b>au</b>, schreibst du <b>ä</b> oder <b>äu</b>: <b>Ball → Bälle</b>, <b>Haus → Häuser</b>. Findest du keins, schreibst du meistens e oder eu.",
  q:"Gibt es ein verwandtes Wort mit a oder au?",
  levels:[
   {task:"Leite ab und wähle: e oder ä?", type:"choice", items:[
    {w:"die B_lle",o:["e","ä"],a:"ä",why:"der Ball → Bälle"},
    {w:"die H_nde",o:["e","ä"],a:"ä",why:"die Hand → Hände"},
    {w:"die B_tten",o:["e","ä"],a:"e",why:"kein Wort mit a → Betten"},

    {w:"die K_lte",o:["e","ä"],a:"ä",why:"kalt → Kälte"}]},
   {task:"Leite ab und wähle: eu oder äu?", type:"choice", items:[
    {w:"die H_ser",o:["eu","äu"],a:"äu",why:"das Haus → Häuser"},
    {w:"das F_er",o:["eu","äu"],a:"eu",why:"kein Wort mit au → Feuer"},
    {w:"die B_me",o:["eu","äu"],a:"äu",why:"der Baum → Bäume"},
    {w:"die L_te",o:["eu","äu"],a:"eu",why:"kein Wort mit au → Leute"},
    {w:"die M_se",o:["eu","äu"],a:"äu",why:"die Maus → Mäuse"},
    {w:"tr_men",o:["eu","äu"],a:"äu",why:"der Traum → träumen"},
    {w:"h_te",o:["eu","äu"],a:"eu",why:"kein Wort mit au → heute"},
    {w:"die Kr_ter",o:["eu","äu"],a:"äu",why:"das Kraut → Kräuter"}]},
   {task:"Fehlerdetektiv: Tippe das falsch geschriebene Wort an.", type:"detect", items:[
    {s:"Im Herbst fallen die Bletter von den Bäumen.",wrong:"Bletter",right:"Blätter",why:"das Blatt → Blätter"},
    {s:"Wir reumen heute unser Zimmer auf.",wrong:"reumen",right:"räumen",why:"der Raum → räumen"},
    {s:"Mein Bruder fehrt mit dem Fahrrad zur Schule.",wrong:"fehrt",right:"fährt",why:"fahren → er fährt"},
    {s:"Die Meuse fressen den Käse.",wrong:"Meuse",right:"Mäuse",why:"die Maus → Mäuse"},
    {s:"Oma lechelt in die Kamera.",wrong:"lechelt",right:"lächelt",why:"lachen → lächeln"}]}
  ]},
{ id:"merk", name:"Merkwörter", c:"--s4", short:"Wörter, die du dir merken musst",
  merk:"Manche Wörter kannst du nicht schwingen, verlängern oder ableiten. Du musst sie dir <b>merken</b>: Wörter mit <b>Dehnungs-h</b> (Zahn), mit <b>doppeltem Selbstlaut</b> (Boot) oder mit <b>v</b> statt f (Vogel). Schreibe sie oft ab und lerne sie mit deiner Wörterkartei.",
  q:"Ist es ein Merkwort? Schau es dir genau an.",
  levels:[
   {task:"Wähle das richtig geschriebene Wort.", type:"choice", items:[
    {w:"",o:["Vogel","Fogel"],a:"Vogel",why:"Merkwort mit v"},
    {w:"",o:["Zan","Zahn"],a:"Zahn",why:"Merkwort mit Dehnungs-h"},
    {w:"",o:["Bot","Boot"],a:"Boot",why:"Merkwort mit oo"},
    {w:"",o:["Vater","Fater"],a:"Vater",why:"Merkwort mit v"},
    {w:"",o:["Ur","Uhr"],a:"Uhr",why:"Merkwort mit Dehnungs-h"},
    {w:"",o:["Mer","Meer"],a:"Meer",why:"Merkwort mit ee"},
    {w:"",o:["Haar","Har"],a:"Haar",why:"Merkwort mit aa"},
    {w:"",o:["Fuks","Fuchs"],a:"Fuchs",why:"Merkwort mit chs"}]},
   {task:"Welches Merkzeichen hat das Wort?", type:"choice", items:[
    {w:"die Zahl",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"Dehnungs-h",why:"Za<b>h</b>l"},
    {w:"das Moos",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"doppelter Selbstlaut",why:"M<b>oo</b>s"},
    {w:"der Pullover",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"v statt f",why:"Pullo<b>v</b>er"},
    {w:"der Stuhl",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"Dehnungs-h",why:"Stu<b>h</b>l"},
    {w:"der Klee",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"doppelter Selbstlaut",why:"Kl<b>ee</b>"},
    {w:"vorne",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"v statt f",why:"<b>v</b>orne"},
    {w:"die Bohne",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"Dehnungs-h",why:"Bo<b>h</b>ne"},
    {w:"der Saal",o:["Dehnungs-h","doppelter Selbstlaut","v statt f"],a:"doppelter Selbstlaut",why:"S<b>aa</b>l"}]},
   {task:"Fehlerdetektiv: Tippe das falsch geschriebene Wort an.", type:"detect", items:[
    {s:"Wir fahren mit dem Bot über den See.",wrong:"Bot",right:"Boot",why:"Merkwort mit oo"},
    {s:"Der Fogel singt im Kirschbaum.",wrong:"Fogel",right:"Vogel",why:"Merkwort mit v"},
    {s:"Meine Ur ist stehen geblieben.",wrong:"Ur",right:"Uhr",why:"Merkwort mit Dehnungs-h"},
    {s:"In den Ferien fahren wir ans Mer.",wrong:"Mer",right:"Meer",why:"Merkwort mit ee"},
    {s:"Der Fuks schleicht durch den Wald.",wrong:"Fuks",right:"Fuchs",why:"Merkwort mit chs"}]}
  ]},
{ id:"gross", name:"Groß und klein", c:"--s5", short:"Nomen und Nominalisierungen",
  merk:"<b>Nomen</b> schreibst du groß. Du erkennst sie am Begleiter (der, die, das, ein, eine). Auch Verben und Adjektive werden zu Nomen, wenn ein <b>Signalwort</b> davorsteht: <b>das</b> Lesen, <b>beim</b> Essen, <b>zum</b> Malen, <b>etwas</b> Schönes, <b>alles</b> Gute, <b>nichts</b> Neues.",
  q:"Steht ein Begleiter oder ein Signalwort davor?",
  levels:[
   {task:"Tippe alle Wörter an, die du großschreiben musst. Dann prüfe.", type:"click", items:[
    {s:"Der hund spielt mit dem ball.",t:["hund","ball"]},
    {s:"Meine oma backt einen kuchen.",t:["oma","kuchen"]},
    {s:"Im garten blühen viele blumen.",t:["garten","blumen"]},
    {s:"Heute besucht lena ihre freundin.",t:["lena","freundin"]},
    {s:"Am montag schreiben wir eine probe.",t:["montag","probe"]}]},
   {task:"Achte auf Signalwörter! Tippe alle Wörter an, die du großschreiben musst.", type:"click", items:[
    {s:"Das lesen macht mir spaß.",t:["lesen","spaß"]},
    {s:"Beim essen schaue ich nicht aufs handy.",t:["essen","handy"]},
    {s:"Zum malen brauchst du bunte farben.",t:["malen","farben"]},
    {s:"Mein bruder hat angst vor dem tauchen.",t:["bruder","angst","tauchen"]},
    {s:"Im winter gehen wir gern zum rodeln.",t:["winter","rodeln"]}]},
   {task:"Adjektive als Nomen: Tippe alle Wörter an, die du großschreiben musst.", type:"click", items:[
    {s:"Ich wünsche dir alles gute.",t:["gute"]},
    {s:"Im kino haben wir etwas lustiges gesehen.",t:["kino","lustiges"]},
    {s:"Gibt es heute nichts neues?",t:["neues"]},
    {s:"In den ferien haben wir viel schönes erlebt.",t:["ferien","schönes"]},
    {s:"Im zeltlager gab es wenig spannendes.",t:["zeltlager","spannendes"]}]}
  ]}
];

const LEVEL_LABELS=["★","★★","★★★"];
const app=document.getElementById("app");
let scores={};
try{scores=JSON.parse(localStorage.getItem("fresch-scores")||"{}")}catch(e){scores={}}
function save(){try{localStorage.setItem("fresch-scores",JSON.stringify(scores))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=w=>w.replace(/[.,!?]/g,"").toLowerCase();
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function home(){
  document.documentElement.style.removeProperty("--c");
  app.innerHTML=`
  <header>
    <h1>FRESCH-<span>Trainer</span></h1>
    <p class="lead">Fünf Strategien für richtiges Schreiben. Wähle eine Station und starte mit ★. Wenn du sicher bist, probiere ★★ und ★★★.</p>
  </header>
  <div class="grid">${STATIONS.map(s=>`
    <button class="card" style="--c:var(${s.c})" data-go="${s.id}">
      <span class="sym" style="color:var(${s.c})">${SYM[s.id]}</span>
      <span><h3>${s.name}</h3><p>${s.short}</p>
      <span class="stars">${LEVEL_LABELS.map((l,i)=>{const r=scores[s.id+i];return `<span class="${r?"done":""}">${l}${r?" "+r:""}</span>`}).join("")}</span></span>
    </button>`).join("")}
  </div>
  <div class="helper"><strong>Partnerarbeit:</strong> Arbeitet zu zweit an einem Gerät. Wer die Strategie schon gut kann, ist <strong>Experte</strong>: Er oder sie liest die Merkbox vor und erklärt, wie man prüft. Der Partner antwortet und begründet laut.</div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>station(b.dataset.go,0));
}

let st,lv,items,idx,results,tries;
function station(id,level){
  st=STATIONS.find(s=>s.id===id); lv=level;
  document.documentElement.style.setProperty("--c",`var(${st.c})`);
  items=shuffle(st.levels[lv].items); idx=0; results=[];
  render();
}
function frame(inner){
  app.innerHTML=`
  <div class="top"><button class="back" id="back">← Alle Stationen</button>
    <h2 style="color:var(--c);font-size:1.8rem;display:flex;align-items:center;gap:10px"><span style="color:var(--c)">${SYM[st.id]}</span>${st.name}</h2></div>
  <div class="merk"><h3>Merkbox</h3><p>${st.merk}</p></div>
  <div class="levels" role="group" aria-label="Schwierigkeit">${LEVEL_LABELS.map((l,i)=>`<button class="lvl" data-l="${i}" aria-pressed="${i===lv}">${l}</button>`).join("")}</div>
  <div class="sheet">${inner}</div>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>station(st.id,+b.dataset.l));
}
function progress(){return `<div class="progress">${items.map((_,i)=>`<i class="${results[i]===true?"ok":results[i]===false?"no":i===idx?"now":""}"></i>`).join("")}</div>`}

function render(){
  if(idx>=items.length) return finish();
  const L=st.levels[lv], it=items[idx]; tries=0;
  let body="";
  if(L.type==="choice"){
    const word=it.w.includes("_")?esc(it.w).replace("_",'<span class="gap" id="gap">?</span>'):esc(it.w);
    body=`${it.w?`<div class="word">${word}</div>`:'<div style="height:12px"></div>'}
      <div class="opts">${shuffle(it.o).map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
  } else {
    body=`<div class="sentence">${it.s.split(" ").map((w,i)=>`<button class="tok" data-i="${i}">${esc(w)}</button>`).join("")}</div>
      ${L.type==="click"?'<div class="row"><button class="btn" id="check">Prüfen</button></div>':""}`;
  }
  frame(`<p class="task">${L.task}</p>${progress()}${body}
    <div id="fb"></div>
    <p class="hint" id="hintwrap"><button class="btn ghost" id="hint">Helfer-Tipp</button></p>`);
  document.getElementById("hint").onclick=()=>{document.getElementById("hintwrap").innerHTML="💡 "+st.q};

  if(L.type==="choice"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      tries++;
      if(b.textContent===it.a){
        b.classList.add("right");
        app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        const g=document.getElementById("gap"); if(g){g.textContent=it.a}
        done(tries===1,it.why);
      } else { b.classList.add("wrong"); b.disabled=true; feedback(false,"Noch nicht. Probier es noch einmal!"); }
    });
  } else if(L.type==="detect"){
    app.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{
      if(b.disabled) return; tries++;
      if(clean(b.textContent)===clean(it.wrong)){
        b.textContent=b.textContent.replace(it.wrong,it.right); b.classList.add("right");
        app.querySelectorAll(".tok").forEach(x=>{x.disabled=true;x.classList.add("fixed")});
        done(tries===1,`Richtig ist <b>${esc(it.right)}</b>: ${it.why}`);
      } else { b.classList.add("wrong"); b.disabled=true; feedback(false,"Dieses Wort ist richtig. Such weiter!"); }
    });
  } else {
    const toks=[...app.querySelectorAll(".tok")];
    toks.forEach((b,i)=>{ if(i===0){b.disabled=true;b.classList.add("fixed");return}
      b.onclick=()=>{b.classList.toggle("sel");const w=b.textContent;b.textContent=b.classList.contains("sel")?cap(w):w.charAt(0).toLowerCase()+w.slice(1)}});
    document.getElementById("check").onclick=()=>{
      tries++; let ok=true;
      toks.forEach((b,i)=>{ if(i===0) return;
        const should=it.t.includes(clean(b.textContent)), is=b.classList.contains("sel");
        b.classList.remove("wrong","miss");
        if(should!==is){ok=false; b.classList.add(is?"wrong":"miss")}});
      if(ok){
        toks.forEach(b=>{b.disabled=true;b.classList.add("fixed");if(b.classList.contains("sel"))b.classList.add("right")});
        document.getElementById("check").remove();
        done(tries===1,"Alle Nomen haben einen großen Anfangsbuchstaben.");
      } else feedback(false,"Noch nicht ganz. Rot: muss klein bleiben. Gestrichelt: fehlt noch.");
    };
  }
}
function feedback(ok,msg){document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${msg}</div>`}
function done(first,why){
  results[idx]=first;
  document.getElementById("fb").innerHTML=`<div class="fb ok">${first?"Super, richtig!":"Jetzt stimmt es!"}<small>${why}</small></div>
    <div class="row"><button class="btn" id="next">${idx+1<items.length?"Weiter →":"Ergebnis ansehen"}</button></div>`;
  const n=document.getElementById("next"); n.focus(); n.onclick=()=>{idx++;render()};
}
function finish(){
  const ok=results.filter(Boolean).length, n=items.length;
  scores[st.id+lv]=`${ok}/${n}`; save();
  const msg=ok===n?"Alles beim ersten Versuch richtig!":ok>=n*0.7?"Gut gemacht! Übe die Fehlerwörter noch einmal.":"Lies die Merkbox noch einmal und versuche es erneut.";
  frame(`<div class="result"><p class="task">Geschafft!</p><div class="big">${ok} / ${n}</div>
    <p>beim ersten Versuch richtig</p><p>${msg}</p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="again">Noch einmal</button>
      ${lv<2?`<button class="btn" id="up">Weiter mit ${LEVEL_LABELS[lv+1]}</button>`:`<button class="btn" id="home2">Andere Station</button>`}
    </div></div>`);
  document.getElementById("again").onclick=()=>station(st.id,lv);
  const up=document.getElementById("up"); if(up) up.onclick=()=>station(st.id,lv+1);
  const h=document.getElementById("home2"); if(h) h.onclick=home;
}
home();
</script>
